<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Google ID Token – The Antique Room</title>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
      textarea { width: 100%; height: 160px; font-family: monospace; font-size: 12px; }
      button { padding: 8px 16px; margin-top: 8px; cursor: pointer; }
      .muted { color: #666; font-size: 14px; }
    </style>
  </head>
  <body>
    <h2>Get a Google ID token</h2>
    <p class="muted">Sign in, then paste the token into the Postman variable <b>googleIdToken</b>. It expires in about 1 hour.</p>

    <div id="g_id_onload" data-client_id="1018895288382-n03mn1dsi365csi3bk3olt52kuhrtvua.apps.googleusercontent.com" data-callback="onGoogleSignIn" data-auto_prompt="false"></div>
    <div class="g_id_signin" data-type="standard"></div>

    <div id="result" hidden>
      <p><b>Signed in as:</b> <span id="who"></span></p>
      <textarea id="token" readonly></textarea>
      <button id="copy">Copy token</button>
      <span id="copied" class="muted"></span>
    </div>

    <script>
      function onGoogleSignIn(response) {
        const token = response.credential;
        const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        document.getElementById('who').textContent = payload.name + ' (' + payload.email + ')';
        document.getElementById('token').value = token;
        document.getElementById('result').hidden = false;
        console.log('GOOGLE ID TOKEN:', token);
      }
      document.getElementById('copy').onclick = async () => {
        await navigator.clipboard.writeText(document.getElementById('token').value);
        document.getElementById('copied').textContent = 'Copied!';
      };
    </script>
  </body>
</html>
